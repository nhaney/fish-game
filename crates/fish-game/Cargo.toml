[package]
name = "fish-game"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
# By default, include all features in the build to allow for compatibility with dev tools.
# Release builds will always use a specific feature.
default = ["common", "linux", "wasm", "dev"]

common = [
    "bevy/bevy_asset",
    "bevy/bevy_audio",
    "bevy/bevy_color",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_log",
    "bevy/bevy_render",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/bevy_state",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_window",
    "bevy/bevy_winit",
    "bevy/default_font",
    "bevy/png",
    "bevy/vorbis",
]

desktop = [
    "bevy/multi_threaded",
]

linux = [
    "common", "desktop", "bevy/x11"
]

wasm = [
    "common", "bevy/webgl2", "dep:web-sys", "dep:wasm-bindgen"
]

dev = [
    "common", "linux", "bevy/dynamic_linking",
]

[dependencies]
fish-game-core = { workspace = true }
fish-game-replay = { workspace = true }

bevy = { version = "0.18.1", default-features = false }

rand = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

web-sys = { version = "0.3.4", optional = true, features = [ 'Storage', 'Window'] }
wasm-bindgen = { version = "0.2.92", optional = true }
