[workspace]
members = [
    "crates/fish-game",
    "crates/fish-game-core",
    "tools/replay-verify",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Nigel Haney <me@nigelhaney.com>"]
edition = "2021"

[workspace.dependencies]
fish-game-core = { path = "crates/fish-game-core" }

glam = { version = "0.25", default-features = false, features = ["libm", "serde"] }
rand = "0.8.5"
rand_chacha = { version = "0.3.1", features = ["serde1"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
slotmap = { version = "1.0", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 's'

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = 'abort'
